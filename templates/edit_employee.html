<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Employee</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            href="/"
            class="navbar-brand"
        >
            Employee Management
        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card">

                <div class="card-body">

                    <h3 class="mb-4">
                        Edit Employee
                    </h3>


                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                value="{{ employee.name }}"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                value="{{ employee.email }}"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Department
                            </label>

                            <input
                                type="text"
                                name="department"
                                class="form-control"
                                value="{{ employee.department }}"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Position
                            </label>

                            <input
                                type="text"
                                name="position"
                                class="form-control"
                                value="{{ employee.position }}"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success"
                        >
                            Update Employee
                        </button>

                        <a
                            href="/"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
